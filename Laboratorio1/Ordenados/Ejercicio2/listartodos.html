<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Departamentos Ordenados</title>
    <style>
        body {
            background-color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333333;
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 20px;
        }

        header {
            background-color: #003B8F;
            color: #FFFFFF;
            padding: 1rem 20px;
            text-align: center;
            border-bottom: 5px solid #002A66;
        }

        header h1 {
            margin: 0;
            font-size: 2.2rem;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 850px;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 2px 3px rgba(0, 0, 0, 0.1);
        }

        th,
        td {
            padding: 12px 15px;
            border: 1px solid #ddd;
            text-align: left;
        }

        thead th {
            background-color: #003B8F;
            color: #FFFFFF;
            font-weight: 600;
        }

        tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tbody tr:hover {
            background-color: #e9e9e9;
        }

        #mensaje {
            text-align: center;
            margin-top: 20px;
            font-size: 1.1rem;
            color: #555;
        }

        .close-button {
            padding: 10px 15px;
            background-color: #003B8F;
            color: #FFFFFF;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
            transition: background-color 0.3s ease;
        }

        .close-button:hover {
            background-color: #002A66;
        }

        .theme-toggle-btn {
            background: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 20px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            color: #333;
            white-space: nowrap;
        }

        .theme-toggle-btn:hover {
            background-color: #e0e0e0;
        }

        .dark-mode body,
        body.dark-mode {
            background-color: #121212;
            color: #e0e0e0;
        }

        .dark-mode header {
            background-color: #0d2850;
            border-bottom-color: #001940;
        }

        .dark-mode .close-button {
            background-color: #1976D2;
        }

        .dark-mode .close-button:hover {
            background-color: #1565C0;
        }

        .dark-mode table thead th {
            background-color: #0d2850;
        }

        .dark-mode table tbody tr:nth-child(even) {
            background-color: #1e1e1e;
        }

        .dark-mode table tbody tr:nth-child(odd) {
            background-color: #181818;
        }

        .dark-mode table tbody tr:hover {
            background-color: #2a2a2a;
        }

        .dark-mode table th,
        .dark-mode table td {
            border-color: #333333;
            color: #e0e0e0;
        }

        .dark-mode #mensaje {
            color: #aaa;
        }

        .dark-mode .theme-toggle-btn {
            background-color: #2c2c2c;
            border-color: #555;
            color: #e0e0e0;
        }

        .dark-mode .theme-toggle-btn:hover {
            background-color: #3d3d3d;
        }

        .dark-mode .swal2-popup {
            background-color: #1e1e1e !important;
            color: #e0e0e0 !important;
        }

        .dark-mode .swal2-title,
        .dark-mode .swal2-html-container {
            color: #e0e0e0 !important;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.65rem;
            }

            .container {
                padding: 0 12px;
            }
        }
    </style>
    <script>
        if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark-mode");
        }
    </script>
    <link rel="stylesheet" href="../../sweetalert-uni.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="../../../interfaz-lab1.css">
    <link rel="stylesheet" href="../../../navbar.css">
</head>
<body>
    <div class="top-bar">
        <img src="../../../img/uni.png" alt="Logo de la universidad">
        <span class="university-name">Universidad Nacional de Ingeniería</span>
        <nav class="main-nav" aria-label="Navegación principal">
            <a class="nav-link" href="../../../index.html">Página principal</a>
            <a class="nav-link" href="../../laboratorio1.html">Laboratorio 1</a>
        </nav>
    </div>
    <header>
        <h1>Lista de Departamentos Registrados</h1>
    </header>

    <div class="container">
        <div class="toolbar">
            <button class="close-button" onclick="window.location.replace('ejercicio2.html')">← Regresar</button>
            <button id="btnThemeToggle" class="theme-toggle-btn" onclick="toggleTheme()">
                🌙 Modo Oscuro
            </button>
        </div>

        <div class="table-container">
            <table id="tablaDepartamentos">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Ubicación</th>
                        <th>Extensión</th>
                        <th>Precio</th>
                        <th>No. Apartamento</th>
                        <th>Persona que renta</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTabla"></tbody>
            </table>
        </div>

        <div id="mensaje">Cargando datos...</div>
    </div>

    <script>
        function mostrarErrorConexion() {
            Swal.fire({
                icon: "error",
                title: "Error de conexión",
                text: "No se pudo conectar con el servidor Java.",
                confirmButtonText: "OK"
            });
        }

        function agregarCelda(fila, valor) {
            const celda = document.createElement("td");
            celda.textContent = valor;
            fila.appendChild(celda);
        }

        function formatearExtension(valor) {
            const numero = Number(valor);
            const extension = Number.isFinite(numero) ? numero : valor;
            return `${extension} m²`;
        }

        function mostrarDepartamentos(texto) {
            const cuerpoTabla = document.getElementById("cuerpoTabla");
            cuerpoTabla.textContent = "";

            const lineas = texto.trim().split(/\r?\n/);
            let numeroFila = 1;

            // Se conserva exactamente el orden recibido desde Java.
            lineas.forEach(linea => {
                if (linea.trim() === "") {
                    return;
                }

                const datos = linea.split("|");
                if (datos.length < 5) {
                    return;
                }

                const fila = document.createElement("tr");
                agregarCelda(fila, numeroFila);
                agregarCelda(fila, datos[0].trim());
                agregarCelda(fila, formatearExtension(datos[1].trim()));
                agregarCelda(fila, datos[2].trim());
                agregarCelda(fila, datos[3].trim());
                agregarCelda(fila, datos[4].trim());
                cuerpoTabla.appendChild(fila);
                numeroFila++;
            });

            return numeroFila - 1;
        }

        async function cargarDepartamentos() {
            const tabla = document.getElementById("tablaDepartamentos");
            const mensaje = document.getElementById("mensaje");

            try {
                const respuesta = await fetch(
                    "http://localhost:8080/ordenado2/listartodos",
                    { cache: "no-store" }
                );
                const texto = await respuesta.text();

                if (!respuesta.ok) {
                    tabla.style.display = "none";
                    mensaje.textContent = texto;
                    return;
                }

                const textoMinuscula = texto.toLowerCase();
                if (
                    textoMinuscula.includes("no hay departamentos registrados") ||
                    textoMinuscula.includes("primero debe iniciar el arreglo")
                ) {
                    tabla.style.display = "none";
                    mensaje.textContent = texto;
                    return;
                }

                const cantidad = mostrarDepartamentos(texto);
                if (cantidad === 0) {
                    tabla.style.display = "none";
                    mensaje.textContent = "No hay departamentos registrados.";
                    return;
                }

                tabla.style.display = "table";
                mensaje.style.display = "none";
            } catch (error) {
                console.error(error);
                tabla.style.display = "none";
                mensaje.textContent = "";
                mostrarErrorConexion();
            }
        }

        function toggleTheme() {
            const esOscuro = document.documentElement.classList.toggle("dark-mode");
            localStorage.setItem("theme", esOscuro ? "dark" : "light");
            actualizarBotonTheme();
        }

        function actualizarBotonTheme() {
            const boton = document.getElementById("btnThemeToggle");
            const esOscuro = document.documentElement.classList.contains("dark-mode");
            boton.innerHTML = esOscuro ? "☀️ Modo Claro" : "🌙 Modo Oscuro";
        }

        function prepararPagina() {
            actualizarBotonTheme();
            cargarDepartamentos();
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", prepararPagina);
        } else {
            prepararPagina();
        }
    </script>
</body>
</html>
