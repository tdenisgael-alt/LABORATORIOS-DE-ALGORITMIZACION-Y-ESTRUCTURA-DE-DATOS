<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arreglos Ordenados: Ejercicio 2</title>
    <link rel="stylesheet" href="ejercicio2.css">
    <link rel="stylesheet" href="../../sweetalert-uni.css">
    <script>
        if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark-mode");
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="../../../interfaz-lab1.css">
    <link rel="stylesheet" href="../../../navbar.css">
</head>
<body>
    <div class="top-bar">
        <img src="../../../img/uni.png" alt="Logo de la universidad">
        <span class="university-name">Universidad Nacional de Ingeniería</span>
        <nav class="main-nav" aria-label="Navegación principal">
            <a class="nav-link" href="../../../index.html">Página principal</a>
            <a class="nav-link" href="../../laboratorio1.html">Laboratorio 1</a>
        </nav>
    </div>
    <header>
        <h1>Arreglos Ordenados: Ejercicio 2</h1>
    </header>

    <div class="container">
        <main>
            <div class="menu-container">
                <div class="menu-header">
                    <h2>Menú de Opciones</h2>
                    <button id="btnThemeToggle" class="theme-toggle-btn" onclick="toggleTheme()">
                        🌙 Modo Oscuro
                    </button>
                </div>

                <div id="configuracionArreglo" class="form-section">
                    <h4>Configurar arreglo</h4>
                    <label for="tamArreglo">Tamaño del arreglo:</label>
                    <input
                        type="number"
                        id="tamArreglo"
                        min="1"
                        step="1"
                        placeholder="Ejemplo: 5"
                    >
                    <button onclick="iniciarArreglo()">Iniciar ejercicio</button>
                    <button onclick="cerrarVentana()">Salir</button>
                </div>

                <div class="menu-options" id="menuOpciones" style="display: none;">
                    <button onclick="mostrarAlta()">1. Dar de alta</button>
                    <button onclick="mostrarBaja()">2. Dar de baja</button>
                    <button onclick="mostrarModificar()">3. Modificar precio</button>
                    <button onclick="mostrarUno()">4. Listar un departamento</button>
                    <button onclick="listarTodos()">5. Listar todos</button>
                    <button onclick="cerrarVentana()">6. Salir</button>
                </div>

                <div id="formAlta" class="form-section" style="display: none;">
                    <h4>Dar de alta</h4>

                    <label for="ubicacionDepartamento">Ubicación:</label>
                    <input type="text" id="ubicacionDepartamento" placeholder="Ingrese la ubicación">

                    <label for="extensionDepartamento">Extensión en m²:</label>
                    <input type="number" id="extensionDepartamento" min="0.01" step="any" placeholder="Ejemplo: 45">

                    <label for="precioDepartamento">Precio:</label>
                    <input type="number" id="precioDepartamento" min="0" step="any" placeholder="Ejemplo: 450">

                    <label for="numeroApartamento">Número de apartamento:</label>
                    <input type="number" id="numeroApartamento" min="1" step="1" placeholder="Ejemplo: 3">

                    <label for="nombrePersona">Nombre de la persona que renta:</label>
                    <input type="text" id="nombrePersona" placeholder="Ingrese el nombre completo">

                    <button onclick="darDeAltaDepartamento()">Guardar</button>
                </div>

                <div id="formBaja" class="form-section" style="display: none;">
                    <h4>Dar de baja</h4>
                    <label for="numeroApartamentoBaja">Número de apartamento:</label>
                    <input type="number" id="numeroApartamentoBaja" min="1" step="1" placeholder="Ingrese el número">
                    <button onclick="darDeBajaDepartamento()">Liberar</button>
                </div>

                <div id="formModificar" class="form-section" style="display: none;">
                    <h4>Modificar precio</h4>
                    <label for="numeroApartamentoModificar">Número de apartamento:</label>
                    <input type="number" id="numeroApartamentoModificar" min="1" step="1" placeholder="Ingrese el número">

                    <label for="precioModificar">Nuevo precio:</label>
                    <input type="number" id="precioModificar" min="0" step="any" placeholder="Ingrese el nuevo precio">

                    <button onclick="modificarPrecioDepartamento()">Actualizar</button>
                </div>

                <div id="formListarUno" class="form-section" style="display: none;">
                    <h4>Listar un departamento</h4>
                    <label for="numeroApartamentoListar">Número de apartamento:</label>
                    <input type="number" id="numeroApartamentoListar" min="1" step="1" placeholder="Ingrese el número">
                    <button onclick="listarUnDepartamento()">Buscar</button>
                </div>
            </div>
        </main>
    </div>

    <script src="ejercicio2.js"></script>
</body>
</html>
