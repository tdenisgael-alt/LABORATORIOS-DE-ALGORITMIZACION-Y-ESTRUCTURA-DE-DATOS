<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arreglos Ordenados: Ejercicio 3</title>
    <link rel="stylesheet" href="ejercicio3.css">
    <link rel="stylesheet" href="../../sweetalert-uni.css">
    <script>
        if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark-mode");
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <header>
        <h1>Arreglos Ordenados: Ejercicio 3</h1>
    </header>

    <div class="container">
        <main>
            <div class="menu-container">
                <div class="menu-header">
                    <h2>Menú de Opciones</h2>
                    <button id="btnThemeToggle" class="theme-toggle-btn" onclick="toggleTheme()">
                        🌙 Modo Oscuro
                    </button>
                </div>

                <div id="configuracionArreglo" class="form-section">
                    <h4>Configurar arreglo</h4>
                    <label for="tamArreglo">Tamaño del arreglo:</label>
                    <input
                        type="number"
                        id="tamArreglo"
                        min="1"
                        step="1"
                        placeholder="Ejemplo: 5"
                    >
                    <button onclick="iniciarArreglo()">Iniciar ejercicio</button>
                    <button onclick="cerrarVentana()">Salir</button>
                </div>

                <div class="menu-options" id="menuOpciones" style="display: none;">
                    <button onclick="mostrarAlta()">1. Dar de alta</button>
                    <button onclick="mostrarModificar()">2. Modificar total de ventas</button>
                    <button onclick="mostrarUno()">3. Listar un vendedor</button>
                    <button onclick="cerrarVentana()">4. Salir</button>
                </div>

                <div id="formAlta" class="form-section" style="display: none;">
                    <h4>Dar de alta</h4>

                    <label for="nombreVendedor">Nombre del vendedor:</label>
                    <input type="text" id="nombreVendedor" placeholder="Ingrese el nombre completo">

                    <label for="totalVentasVendedor">Total de ventas:</label>
                    <input type="number" id="totalVentasVendedor" min="0" step="any" placeholder="Ejemplo: 1500">

                    <button onclick="darDeAltaVendedor()">Guardar</button>
                </div>

                <div id="formModificar" class="form-section" style="display: none;">
                    <h4>Modificar total de ventas</h4>

                    <label for="nombreModificar">Nombre del vendedor:</label>
                    <input type="text" id="nombreModificar" placeholder="Ingrese el nombre completo">

                    <label for="totalVentasModificar">Nuevo total de ventas:</label>
                    <input type="number" id="totalVentasModificar" min="0" step="any" placeholder="Ingrese el nuevo total">

                    <button onclick="modificarTotalVentas()">Actualizar</button>
                </div>

                <div id="formListarUno" class="form-section" style="display: none;">
                    <h4>Listar un vendedor</h4>
                    <label for="nombreListar">Nombre del vendedor:</label>
                    <input type="text" id="nombreListar" placeholder="Ingrese el nombre completo">
                    <button onclick="listarUnVendedor()">Buscar</button>
                </div>
            </div>
        </main>
    </div>

    <script src="ejercicio3.js"></script>
</body>
</html>
