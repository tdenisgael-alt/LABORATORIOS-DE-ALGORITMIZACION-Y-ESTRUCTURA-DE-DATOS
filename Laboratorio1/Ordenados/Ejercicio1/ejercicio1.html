<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arreglos Ordenados: Ejercicio 1</title>
    <link rel="stylesheet" href="ejercicio1.css">
    <link rel="stylesheet" href="../../sweetalert-uni.css">
    <script>
        if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark-mode");
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <header>
        <h1>Arreglos Ordenados: Ejercicio 1</h1>
    </header>

    <div class="container">
        <main>
            <div class="menu-container">
                <div class="menu-header">
                    <h2>Menú de Opciones</h2>
                    <button id="btnThemeToggle" class="theme-toggle-btn" onclick="toggleTheme()">
                        🌙 Modo Oscuro
                    </button>
                </div>

                <div id="configuracionArreglo" class="form-section">
                    <h4>Configurar arreglo</h4>
                    <label for="tamArreglo">Tamaño del arreglo:</label>
                    <input
                        type="number"
                        id="tamArreglo"
                        min="1"
                        step="1"
                        placeholder="Ejemplo: 5"
                    >

                    <div class="form-actions">
                        <button onclick="iniciarArreglo()">Iniciar ejercicio</button>
                        <button onclick="cerrarVentana()">Salir</button>
                    </div>
                </div>

                <div class="menu-options" id="menuOpciones" style="display: none;">
                    <button onclick="listarTodos()">1. Listar todos</button>
                    <button onclick="mostrarAlta()">2. Dar de alta</button>
                    <button onclick="mostrarBaja()">3. Dar de baja</button>
                    <button onclick="mostrarModificar()">4. Modificar años de antigüedad</button>
                    <button onclick="mostrarUno()">5. Listar un empleado</button>
                    <button onclick="cerrarVentana()">6. Salir</button>
                </div>

                <div id="formAlta" class="form-section" style="display: none;">
                    <h4>Dar de alta</h4>

                    <label for="nombreEmpleado">Nombre completo:</label>
                    <input type="text" id="nombreEmpleado" placeholder="Ingrese el nombre completo">

                    <label for="direccionEmpleado">Dirección:</label>
                    <input type="text" id="direccionEmpleado" placeholder="Ingrese la dirección">

                    <label for="edadEmpleado">Edad:</label>
                    <input type="number" id="edadEmpleado" min="1" step="1" placeholder="Ejemplo: 25">

                    <label for="sexoEmpleado">Sexo:</label>
                    <select id="sexoEmpleado">
                        <option value="M">Masculino</option>
                        <option value="F">Femenino</option>
                    </select>

                    <label for="antiguedadEmpleado">Años de antigüedad:</label>
                    <input type="number" id="antiguedadEmpleado" min="0" step="1" placeholder="Ejemplo: 3">

                    <button onclick="darDeAltaEmpleado()">Guardar</button>
                </div>

                <div id="formBaja" class="form-section" style="display: none;">
                    <h4>Dar de baja</h4>
                    <label for="nombreBaja">Nombre del empleado:</label>
                    <input type="text" id="nombreBaja" placeholder="Ingrese el nombre completo">
                    <button onclick="darDeBajaEmpleado()">Eliminar</button>
                </div>

                <div id="formModificar" class="form-section" style="display: none;">
                    <h4>Modificar años de antigüedad</h4>
                    <label for="nombreModificar">Nombre del empleado:</label>
                    <input type="text" id="nombreModificar" placeholder="Ingrese el nombre completo">

                    <label for="antiguedadModificar">Nuevos años de antigüedad:</label>
                    <input type="number" id="antiguedadModificar" min="0" step="1" placeholder="Ejemplo: 5">

                    <button onclick="modificarAntiguedadEmpleado()">Actualizar</button>
                </div>

                <div id="formListarUno" class="form-section" style="display: none;">
                    <h4>Listar un empleado</h4>
                    <label for="nombreListar">Nombre del empleado:</label>
                    <input type="text" id="nombreListar" placeholder="Ingrese el nombre completo">
                    <button onclick="listarUnEmpleado()">Buscar</button>
                </div>
            </div>
        </main>
    </div>

    <script src="ejercicio1.js"></script>
</body>
</html>
