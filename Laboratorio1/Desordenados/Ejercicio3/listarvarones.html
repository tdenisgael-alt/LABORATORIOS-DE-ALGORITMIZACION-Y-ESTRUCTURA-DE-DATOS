    <style>

        }

        tbody tr:hover {

        /* Mensaje de carga o error */
        #mensaje {
            text-align: center;
            margin-top: 20px;
            font-size: 1.1rem;
            color: #555;
        }

        /* Estilo para el botón de regresar */
        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 15px;
            background-color: #003B8F;
            color: #FFFFFF;

            border: none;

            transition: background-color 0.3s ease;
        }

        .back-button:hover {
            background-color: #002A66;
        }

        /* Botón para alternar modo oscuro */
        .theme-toggle-btn {
            background: #f0f0f0;

        .dark-mode header {

        }

        .dark-mode table th,
        .dark-mode table td {
            border-color: #333333;
            color: #e0e0e0;

        .dark-mode #mensaje {
            color: #aaa;
        }

        .dark-mode .theme-toggle-btn {
            background-color: #2c2c2c;

            color: #e0e0e0;

    <script>
        if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark-mode");

<body>
    <div class="top-bar">
        <img src="../../../img/uni.png" alt="Logo de la universidad">
        <span class="university-name">Universidad Nacional de Ingeniería</span>
        <nav class="main-nav" aria-label="Navegación principal">
            <a class="nav-link" href="../../../index.html">Página principal</a>
            <a class="nav-link" href="../../laboratorio1.html">Laboratorio 1</a>
        </nav>
    </div>

<header>
    <h1>Lista de Empleados Varones</h1>
</header>

<div class="container">
    <div class="toolbar">
        <button class="back-button" style="margin-bottom: 0;" onclick="window.location.replace('ejercicio3.html')">
            ← Regresar
        </button>
        <button id="btnThemeToggle" class="theme-toggle-btn" onclick="toggleTheme()">🌙 Modo Oscuro</button>
    </div>

    <table id="tablaEmpleados">
        <thead>
            <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Sexo</th>
                <th>Edad</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla">
            <!-- Las filas de los empleados se insertarán aquí -->
        </tbody>
    </table>

    <div id="mensaje">Cargando datos...</div>
</div>

<script>
    /**
     * Llama al servidor para obtener la lista de empleados varones
     * y la muestra en la tabla.
     */
    async function cargarVarones() {
        const tabla = document.getElementById("tablaEmpleados");
        const cuerpoTabla = document.getElementById("cuerpoTabla");
        const mensajeDiv = document.getElementById("mensaje");

        try {
            // 1. Hacer la petición al servidor
            const respuesta = await fetch(
                "http://localhost:8080/desordenado3/listarvarones"
            );

            const textoRespuesta = await respuesta.text();

            // 2. Comprobar si hubo un error en el servidor
            if (!respuesta.ok) {
                tabla.style.display = "none";
                mensajeDiv.style.display = "block";
                mensajeDiv.textContent = `Error: ${textoRespuesta}`;
                return;
            }

            // 3. Comprobar si no hay empleados varones
            const textoMin = textoRespuesta.toLowerCase();
            if (
                textoMin.includes("no hay empleados") ||
                textoMin.includes("no hay varones") ||
                textoMin.includes("arreglo vac") ||
                textoRespuesta.trim() === "" ||
                textoMin === "servidor java en ejecucion"
            ) {
                tabla.style.display = "none";
                mensajeDiv.style.display = "block";
                mensajeDiv.textContent = "No hay empleados varones registrados.";
                return;
            }

            // 4. Procesar la respuesta separada por líneas (\n) y campos (|)
            const lineas = textoRespuesta.split(/\r?\n/).filter(l => l.trim().length > 0);
            let numero = 1;

            lineas.forEach(linea => {
                const l = linea.trim();

                // Ignorar encabezados o mensajes del servidor
                if (l.toLowerCase().includes("servidor java en ejecucion") || l.startsWith("---")) {
                    return;
                }

                let nombre = "", sexo = "", edad = "";

                if (l.includes("|")) {
                    const partes = l.split("|");
                    nombre = partes[0] ? partes[0].trim() : "";
                    sexo = partes[1] ? partes[1].trim() : "";
                    edad = partes[2] ? partes[2].trim() : "";
                } else if (/^nombre:/i.test(l)) {
                    nombre = l.replace(/^nombre:/i, "").trim();
                } else {
                    nombre = l;
                }

                // Filtrar / formatear sexo a Masculino
                let sexoFormateado = "Masculino";
                if (sexo.toUpperCase() === "F" || sexo.toLowerCase() === "femenino") {
                    // Si viniera un registro femenino por alguna razón, no listarlo en varones
                    return;
                }

                if (nombre) {
                    const fila = document.createElement("tr");
                    fila.innerHTML = `
                        <td>${numero}</td>
                        <td>${nombre}</td>
                        <td>${sexoFormateado}</td>
                        <td>${edad || "-"}</td>
                    `;
                    cuerpoTabla.appendChild(fila);
                    numero++;
                }
            });

            if (numero === 1) {
                tabla.style.display = "none";
                mensajeDiv.style.display = "block";
                mensajeDiv.textContent = "No hay empleados varones registrados.";
            } else {
                tabla.style.display = "table";
                mensajeDiv.style.display = "none";
            }

        } catch (error) {
            console.error("Error de conexión:", error);
            tabla.style.display = "none";
            mensajeDiv.style.display = "block";
            mensajeDiv.textContent = "Error de conexión: No se pudo conectar con el servidor Java.";
        }
    }

    // Llamar a la función cuando la página se cargue
    cargarVarones();
</script>

</body>
</html>
