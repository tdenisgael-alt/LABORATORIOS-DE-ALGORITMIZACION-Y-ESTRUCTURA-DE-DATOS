<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio 1: Ordenados y Desordenados</title>
    <style>
        /* Estilos generales (copiados de index.html para consistencia) */
        body {
            background-color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333333;
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .top-bar {
            background-color: #FFFFFF;
            padding: 10px 40px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
        }

        .top-bar img {
            height: 50px;
            margin-right: 15px;
        }

        .top-bar .university-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #003B8F;
        }

        header {
            background-color: #003B8F;
            color: #FFFFFF;
            padding: 1rem 0;
            text-align: center;
            border-bottom: 5px solid #002A66;
        }

        header h1 {
            margin: 0;
            font-size: 2.2rem;
        }

        footer {
            text-align: center;
            padding: 15px;
            margin-top: 30px;
            color: #777777;
            font-size: 0.9em;
        }

        /* Estilos específicos para la página del laboratorio */
        .lab-content {
            font-family: "Times New Roman", Times, serif;
        }

        .apartado {
            background-color: #fdfdfd;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .apartado > h2 {
            color: #003B8F;
            border-bottom: 2px solid #003B8F;
            padding-bottom: 10px;
            margin-top: 0;
        }

        .sub-seccion {
            background-color: #f9f9f9;
            border-left: 4px solid #999;
            padding: 15px;
            margin-top: 20px;
            border-radius: 0 4px 4px 0;
        }

        .sub-seccion h3 {
            margin-top: 0;
            color: #555;
        }

        /* Estilo para el botón de regresar */
        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 15px;
            background-color: #003B8F; /* Color principal de la página */
            color: #FFFFFF;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .back-button:hover {
            background-color: #002A66; /* Tono más oscuro para el hover */
        }

        /* Estilo para botones de ejercicios */
        .sub-seccion button {
            padding: 8px 16px;
            background-color: #003B8F; /* Color principal de la página */
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s ease;
        }
        .sub-seccion button:hover {
            background-color: #002A66; /* Tono más oscuro */
        }

        /* Estilos para el formulario de alta */
        #formularioAlta input[type="text"],
        #formularioAlta input[type="number"] {
            width: calc(100% - 20px);
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #mensajeAlta {
            margin-top: 15px;
            font-weight: bold;
        }

        /* Estilos para el menú de opciones del ejercicio */
        #menuEjercicio1 button {
            margin-right: 10px;
            margin-bottom: 10px;
        }

        /* Botón para alternar modo oscuro */
        .theme-toggle-btn {
            background: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 20px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
            margin-left: auto;
            color: #333;
        }

        .theme-toggle-btn:hover {
            background-color: #e0e0e0;
        }

        /* Estilos de Modo Oscuro */
        .dark-mode body,
        body.dark-mode {
            background-color: #121212;
            color: #e0e0e0;
        }

        .dark-mode .top-bar {
            background-color: #1e1e1e;
            border-bottom: 1px solid #333333;
        }

        .dark-mode .top-bar .university-name {
            color: #64B5F6;
        }

        .dark-mode header {
            background-color: #0d2850;
            border-bottom-color: #001940;
        }

        .dark-mode .apartado {
            background-color: #1e1e1e;
            border-color: #333333;
            color: #e0e0e0;
        }

        .dark-mode .apartado > h2 {
            color: #64B5F6;
            border-bottom-color: #64B5F6;
        }

        .dark-mode .sub-seccion {
            background-color: #252525;
            border-left-color: #64B5F6;
        }

        .dark-mode .sub-seccion h3 {
            color: #90CAF9;
        }

        .dark-mode button,
        .dark-mode .back-button {
            background-color: #1976D2;
        }

        .dark-mode button:hover,
        .dark-mode .back-button:hover {
            background-color: #1565C0;
        }

        .dark-mode .theme-toggle-btn {
            background-color: #2c2c2c;
            border-color: #555;
            color: #e0e0e0;
        }

        .dark-mode .theme-toggle-btn:hover {
            background-color: #3d3d3d;
        }

        .dark-mode footer {
            color: #888888;
        }
    </style>
    <script>
        if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark-mode");
        }
    </script>
    <link rel="stylesheet" href="sweetalert-uni.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="top-bar">
        <img src="img/uni.png" alt="Logo Universidad">
        <span class="university-name">UNIVERSIDAD NACIONAL DE INGENIERÍA</span>
        <button id="btnThemeToggle" class="theme-toggle-btn" onclick="toggleTheme()">🌙 Modo Oscuro</button>
    </div>

    <header>
        <h1>Laboratorio: Ordenados y Desordenados</h1>
    </header>

    <div class="container">
        
        <a href="../index.html" onclick="window.location.replace('../index.html'); return false;" class="back-button">← Salir</a>

        <main class="lab-content">
            <div class="apartado">
                <h2>Arreglos Ordenados</h2>
                <div class="sub-seccion">
                    <h3>Ejercicio 1</h3>
                    <button onclick="abrirVentanaOrdenado1()">Abrir ejercicio</button>
                </div>
                <div class="sub-seccion">
                    <h3>Ejercicio 2</h3>
                    <button onclick="abrirVentanaOrdenado2()">Abrir ejercicio</button>
                </div>
                <div class="sub-seccion">
                    <h3>Ejercicio 3</h3>
                    <button onclick="abrirVentanaOrdenado3()">Abrir ejercicio</button>
                </div>
            </div>

            <div class="apartado">
                <h2>Arreglos Desordenados</h2>
                <div class="sub-seccion">
                    <h3>Ejercicio 1</h3>

                    <button onclick="abrirVentanaEjercicio1()">
                        Abrir ejercicio
                    </button>

                </div>
                <div class="sub-seccion">
                    <h3>Ejercicio 2</h3>

                    <button onclick="abrirVentanaEjercicio2()">
                        Abrir ejercicio
                    </button>

                </div>
                <div class="sub-seccion">
                    <h3>Ejercicio 3</h3>

                    <button onclick="abrirVentanaEjercicio3()">
                        Abrir ejercicio
                    </button>

                </div>
            </div>
        </main>
    </div>
    <footer>
        <p>&copy; 2026 - Denis Vallecillo, Carlos Torres, Carlos Valdivia. </p>
    </footer>

    <script>
        /**
         * Abre el ejercicio 1 de arreglos ordenados.
         */
        function abrirVentanaOrdenado1() {
            sessionStorage.removeItem("arregloIniciado_ordenado1");
            window.location.replace('Ordenados/Ejercicio1/ejercicio1.html');
        }

        /**
         * Abre el ejercicio 2 reemplazando la página actual.
         */
        function abrirVentanaOrdenado2() {
            sessionStorage.removeItem("arregloIniciado_ordenado2");
            window.location.replace('Ordenados/Ejercicio2/ejercicio2.html');
        }

        /**
         * Abre el ejercicio 3 reemplazando la página actual.
         */
        function abrirVentanaOrdenado3() {
            sessionStorage.removeItem("arregloIniciado_ordenado3");
            window.location.replace('Ordenados/Ejercicio3/ejercicio3.html');
        }

        /**
         * Abre el ejercicio 1 reemplazando la página actual.
         */
        function abrirVentanaEjercicio1() {
            sessionStorage.removeItem("arregloIniciado");
            window.location.replace('Desordenados/Ejercicio1/ejercicio1.html');
        }

        /**
         * Abre el ejercicio 2 reemplazando la página actual.
         */
        function abrirVentanaEjercicio2() {
            sessionStorage.removeItem("arregloIniciado_desordenado2");
            window.location.replace('Desordenados/Ejercicio2/ejercicio2.html');
        }

        /**
         * Abre el ejercicio 3 reemplazando la página actual.
         */
        function abrirVentanaEjercicio3() {
            sessionStorage.removeItem("arregloIniciado_desordenado3");
            window.location.replace('Desordenados/Ejercicio3/ejercicio3.html');
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle("dark-mode");
            localStorage.setItem("theme", isDark ? "dark" : "light");
            actualizarBotonTheme();
        }

        function actualizarBotonTheme() {
            const btn = document.getElementById("btnThemeToggle");
            if (!btn) return;
            const isDark = document.documentElement.classList.contains("dark-mode");
            btn.innerHTML = isDark ? "☀️ Modo Claro" : "🌙 Modo Oscuro";
        }

        function proximamente(nombre) {
            Swal.fire({
                icon: "info",
                title: "🔒 Próximamente",
                html: `<b>${nombre}</b> aún no está disponible.<br>Estará habilitado próximamente.`,
                confirmButtonText: "Entendido",
                confirmButtonColor: "#003B8F",
                allowOutsideClick: false,
                allowEscapeKey: false,
                backdrop: true
            });
        }

        document.addEventListener("DOMContentLoaded", actualizarBotonTheme);
    </script>
</body>
</html>
